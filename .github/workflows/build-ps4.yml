name: Build IRAQ FPS PS4 PKG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "upstream/vcfg/**"
      - ".github/workflows/build-ps4.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout IRAQ FPS
        uses: actions/checkout@v4

      - name: Checkout pinned VCFG source
        run: |
          git clone --depth 1 --branch v2.36 https://github.com/Melnikoff07/vcfg.git vcfg-src

      - name: Apply IRAQ FPS launcher branding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("vcfg-src/launcher/src")
          replacements = {
              '"VCFG"': '"IRAQ FPS"',
              '"vcfg"': '"iraq-fps"',
          }
          for name in ("app.c", "ui.c"):
              p = root / name
              s = p.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  s = s.replace(old, new)
              p.write_text(s, encoding="utf-8")
          PY

      - name: Prepare reproducible build dependencies
        run: |
          bash vcfg-src/tools/docker-build/fetch-deps.sh
          bash vcfg-src/tools/docker-build/build-images.sh

      - name: Build plugins and PKG
        run: |
          bash vcfg-src/tools/docker-build/build_all.sh vcfg-src "$PWD/out" 2.36 --run-tests

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: IRAQ-FPS-build-2.36
          path: |
            out/VCFG_v2.36.pkg
            out/vcfg.prx
            out/vcfg_classic.prx
            out/build.log
            out/shaders-regen.txt
          if-no-files-found: warn
