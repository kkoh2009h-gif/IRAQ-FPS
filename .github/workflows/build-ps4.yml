name: Build IRAQ FPS PS4 PKG
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y make python3 python3-pil curl clang lld
      - name: Install OpenOrbis toolchain
        run: |
          curl -L https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz -o oo.tar.gz
          mkdir -p "$HOME/oo"
          tar -xzf oo.tar.gz -C "$HOME/oo"
          echo "OO_PS4_TOOLCHAIN=$(dirname "$(find "$HOME/oo" -name link.x | head -1)")" >> "$GITHUB_ENV"
      - name: Prepare package assets
        run: |
          mkdir -p sce_sys/about
          python3 tools/make_icon.py
          cp "$(find "$OO_PS4_TOOLCHAIN" -name right.sprx | head -1)" sce_sys/about/right.sprx
      - name: Build PKG
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: IRAQ-FPS-PS4-PKG
          path: |
            *.pkg
            eboot.bin
          if-no-files-found: error
